<template>
    <lightning-card title="Opportunity Risk Dashboard" icon-name="utility:warning">

        <!-- HOME PAGE: Search mode -->
        <template lwc:if={isSearchMode}>
            <div class="slds-p-around_medium">
                <lightning-input
                    type="search"
                    label="Search Opportunities"
                    placeholder="Type to search..."
                    value={searchTerm}
                    onchange={handleSearchInput}>
                </lightning-input>
                <template lwc:if={searchResults.length}>
                    <div class="search-dropdown slds-box slds-box_small slds-m-top_x-small">
                        <template for:each={searchResults} for:item="opp">
                            <div key={opp.Id} class="search-item slds-p-around_x-small" data-id={opp.Id} data-name={opp.Name} onclick={handleSelectOpp}>
                                <strong>{opp.Name}</strong>
                                <template lwc:if={opp.Account}>
                                    <span class="slds-text-color_weak"> — {opp.Account.Name}</span>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </template>

        <!-- DASHBOARD (record page or after home page selection) -->
        <template lwc:elseif={isDashboardMode}>
            <template lwc:if={isHomePageMode}>
                <div class="slds-p-horizontal_medium slds-p-top_small">
                    <a href="#" onclick={handleBack} class="back-link">&#8592; Back to search</a>
                </div>
            </template>

            <!-- Loading -->
            <template lwc:if={isLoading}>
                <div class="slds-p-around_large slds-align_absolute-center">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>
            </template>

            <!-- Error -->
            <template lwc:elseif={isError}>
                <div class="slds-p-around_medium slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <span>{errorMessage}</span>
                </div>
            </template>

            <!-- No Assessment -->
            <template lwc:elseif={isNoAssessment}>
                <div class="slds-p-around_medium slds-text-color_weak">
                    {labelNoAssessment}
                </div>
            </template>

            <!-- Pending -->
            <template lwc:elseif={isPending}>
                <div class="slds-p-around_medium slds-align_absolute-center">
                    <lightning-spinner alternative-text="Assessing" size="small"></lightning-spinner>
                    <p class="slds-m-top_small slds-text-color_weak">{labelPending}</p>
                </div>
            </template>

            <!-- Completed -->
            <template lwc:elseif={isCompleted}>
                <div class="slds-p-around_medium">
                    <!-- Risk Level Badge -->
                    <div class="slds-grid slds-gutters slds-m-bottom_medium">
                        <div class="slds-col slds-size_1-of-2">
                            <span class={riskLevelBadgeClass}>{assessment.Risk_Level__c}</span>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-text-align_right">
                            <span class="slds-text-body_small slds-text-color_weak">Score: {assessment.Risk_Score__c} / 100</span>
                        </div>
                    </div>

                    <!-- Score Bar -->
                    <div class="score-bar-container slds-m-bottom_medium">
                        <div class="score-bar-track">
                            <div class="score-bar-fill" style={scoreBarStyle}></div>
                        </div>
                    </div>

                    <!-- Headlines -->
                    <template lwc:if={hasRecommendation}>
                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">Latest News Headlines</h3>
                        <ul class="slds-list_dotted slds-m-bottom_medium">
                            <template for:each={headlineList} for:item="headline">
                                <li key={headline} class="slds-m-bottom_x-small">{headline}</li>
                            </template>
                        </ul>
                    </template>

                    <!-- Recommendation Box -->
                    <div class={recommendationBoxClass}>
                        <p class="slds-text-body_regular">{recommendationText}</p>
                    </div>
                </div>

                <!-- Manager action -->
                <template lwc:if={canRequestManualAssessment}>
                    <div slot="footer">
                        <lightning-button
                            label="Request Re-Assessment"
                            variant="brand"
                            onclick={handleRequestAssessment}
                            disabled={isRequestingAssessment}>
                        </lightning-button>
                    </div>
                </template>
            </template>
        </template>

    </lightning-card>
</template>
